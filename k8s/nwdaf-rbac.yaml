# nwdaf-rbac.yaml

apiVersion: v1
kind: ServiceAccount
metadata:
  name: nwdaf-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nwdaf-pod-reader
  namespace: default
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nwdaf-pod-reader-binding
  namespace: default
subjects:
- kind: ServiceAccount
  name: nwdaf-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: nwdaf-pod-reader
  apiGroup: rbac.authorization.k8s.io

