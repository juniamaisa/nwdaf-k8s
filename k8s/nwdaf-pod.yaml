apiVersion: v1
kind: Pod
metadata:
  name: nwdaf
  labels:
    app: nwdaf
  annotations:
    k8s.v1.cni.cncf.io/networks: '[
      { "name": "n4network", "interface": "eth1", "ips": [ "10.10.4.50/24" ] }
    ]'
spec:
  hostNetwork: true
  volumes:
    - name: app-scripts
      emptyDir: {}
  initContainers:
    - name: init-copy-scripts
      image: juniamaisa/nwdaf:latest
      command: ["sh", "-c", "cp -r /app/* /app-shared/"]
      volumeMounts:
        - name: app-scripts
          mountPath: /app-shared
  containers:
    - name: nwdaf
      image: juniamaisa/nwdaf:latest
      command: ["cron", "-f"]
      volumeMounts:
        - name: app-scripts
          mountPath: /app
      env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: database
